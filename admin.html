<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StyleNest Admin</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f6f7fb}.admin{max-width:1100px;margin:30px auto;padding:20px}.panel{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #00000010}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form select{padding:12px;border:1px solid #ddd;border-radius:10px}.form .wide{grid-column:1/-1}.btn{padding:11px 16px;border:0;border-radius:10px;cursor:pointer}.primary{background:#111;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.danger{background:#fee;color:#b00}.muted{color:#666}@media(max-width:700px){.form{grid-template-columns:1fr}.form .wide{grid-column:auto}.table{font-size:12px}}
</style></head><body><main class="admin"><h1>StyleNest Admin</h1><p class="muted">Catalog and order management. COD is disabled.</p>
<div class="panel"><h2>Admin access</h2><input id="key" type="password" placeholder="ADMIN_KEY"><button class="btn primary" onclick="loadAll()">Connect</button><span id="msg"></span></div>
<div class="panel"><h2>Add product</h2><form id="productForm" class="form"><input name="name" placeholder="Product name" required><select name="category"><option>Women</option><option>Men</option><option>Boys</option><option>Shoes</option></select><input name="type" placeholder="Type e.g. Dresses" required><input name="price" type="number" placeholder="Selling price" required><input name="oldPrice" type="number" placeholder="MRP"><input name="discount" type="number" placeholder="Discount %"><input name="rating" placeholder="Rating" value="4.5"><input name="reviews" type="number" placeholder="Reviews" value="0"><input name="size" placeholder="Sizes e.g. S,M,L,XL" value="S,M,L,XL"><input name="color" placeholder="Color" value="Black"><input name="image" class="wide" placeholder="Real product image URL" required><label><input name="new" type="checkbox"> New arrival</label><button class="btn primary wide">Add product</button></form></div>
<div class="panel"><h2>Products</h2><div id="products">Connect first.</div></div><div class="panel"><h2>Orders</h2><div id="orders">Connect first.</div></div></main>
<script>
let KEY='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':KEY};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadAll(){KEY=$('#key').value;try{await loadProducts();await loadOrders();$('#msg').textContent=' Connected';}catch(e){$('#msg').textContent=' '+e.message}}
async function loadProducts(){const a=await api('/api/products');$('#products').innerHTML='<table class="table"><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th></th></tr>'+a.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>₹${Number(p.price).toLocaleString('en-IN')}</td><td><button class="btn danger" onclick="del(${p.id})">Delete</button></td></tr>`).join('')+'</table>'}
async function loadOrders(){const a=await api('/api/admin/orders');$('#orders').innerHTML=a.length?'<table class="table"><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>'+a.map(o=>`<tr><td>${o.id}</td><td>${esc(o.customer.name)}<br>${esc(o.customer.phone)}</td><td>₹${Number(o.total).toLocaleString('en-IN')}</td><td>${esc(o.status)}</td></tr>`).join('')+'</table>':'No orders yet.'}
$('#productForm').onsubmit=async e=>{e.preventDefault();try{const o=Object.fromEntries(new FormData(e.target));o.new=e.target.new.checked;o.price=+o.price;o.oldPrice=+(o.oldPrice||o.price);o.discount=+(o.discount||0);o.reviews=+(o.reviews||0);await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});e.target.reset();await loadProducts();}catch(err){alert(err.message)}};
async function del(id){if(!confirm('Delete product '+id+'?'))return;try{await api('/api/products/'+id,{method:'DELETE'});await loadProducts()}catch(e){alert(e.message)}}
</script></body></html>
